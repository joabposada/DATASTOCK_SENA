info:
  name: Asignar rol a usuario
  type: http
  seq: 3

http:
  method: POST
  url: http://localhost:8080/api/historial-roles
  body:
    type: json
    data: |-
      {
        "idUsuario": 1,
        "idRol": 1,
        "estado": "ACTIVO"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
