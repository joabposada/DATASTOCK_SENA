info:
  name: Crear categoria
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/categorias
  body:
    type: json
    data: |-
      {
        "nombreCategoria": "Lácteos"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
