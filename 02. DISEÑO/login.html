<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataStock - Iniciar Sesión</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1114] min-h-screen flex items-center justify-center font-sans p-4">
    
    <div class="bg-[#111c18] p-10 rounded-[2rem] shadow-2xl w-full max-w-md text-center">
        
        <div class="mb-10 flex flex-col items-center">
            <img src="Logo.png" alt="Logo DataStock" class="w-24 h-24 mb-4 rounded-full shadow-lg object-cover border border-[#20362f]">
            
            <h1 class="text-[#4b7c68] text-3xl font-bold tracking-wide">DataStock</h1>
            <p class="text-slate-400 text-sm mt-2">Sistema de Gestión Profesional</p>
        </div>

        <form action="dashboard.html">
            <div class="mb-5 text-left">
                <label for="correo" class="block text-sm font-semibold text-slate-200 mb-2">
                    Correo Electrónico
                </label>
                <input 
                    type="email" 
                    id="correo" 
                    placeholder="correo@ejemplo.com" 
                    class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                >
            </div>

            <div class="mb-2 text-left relative">
                <label for="password" class="block text-sm font-semibold text-slate-200 mb-2">
                    Contraseña
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="••••••••" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500 tracking-widest"
                    >
                    <button type="button" class="absolute right-4 top-3.5 text-slate-400 cursor-default">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="mb-8 text-right">
                <a href="#" class="text-xs text-slate-400 hover:text-emerald-500 transition-colors font-semibold">
                    ¿Olvidaste tu contraseña?
                </a>
            </div>

            <a href="dashboard.html" class="block w-full bg-[#204239] hover:bg-[#2a564a] text-slate-200 text-center font-semibold py-3 px-4 rounded-xl transition-colors shadow-lg">
                Iniciar Sesión
            </a>
        </form>

        <div class="mt-8 text-sm text-slate-400">
            ¿No tienes cuenta? 
            <a href="registro.html" class="text-[#4b7c68] font-semibold hover:text-emerald-500 transition-colors ml-1">
                Regístrate
            </a>
        </div>

    </div>
</body>
</html>
