<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DataStock - Registro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1114] min-h-screen flex items-center justify-center font-sans p-4">
    
    <div class="bg-[#111c18] p-8 md:p-10 rounded-[2rem] shadow-2xl w-full max-w-2xl">
        
        <div class="mb-8 flex flex-col items-center text-center">
            <img src="Logo.png" alt="DataStock Logo" class="w-16 h-16 mb-4 rounded-full shadow-lg object-cover border border-[#20362f]">
            
            <h1 class="text-[#4b7c68] text-3xl font-bold tracking-wide mb-1">Registro en DataStock</h1>
            <p class="text-slate-400 text-sm">Crea tu cuenta en el sistema</p>
        </div>

        <form action="#">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-x-5 gap-y-6">
                
                <div>
                    <label for="primer_nombre" class="block text-sm font-semibold text-slate-200 mb-2">
                        Primer Nombre *
                    </label>
                    <input 
                        type="text" 
                        id="primer_nombre" 
                        placeholder="Juan" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                    >
                </div>

                <div>
                    <label for="segundo_nombre" class="block text-sm font-semibold text-slate-200 mb-2">
                        Segundo Nombre
                    </label>
                    <input 
                        type="text" 
                        id="segundo_nombre" 
                        placeholder="Carlos" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                    >
                </div>

                <div>
                    <label for="primer_apellido" class="block text-sm font-semibold text-slate-200 mb-2">
                        Primer Apellido *
                    </label>
                    <input 
                        type="text" 
                        id="primer_apellido" 
                        placeholder="Pérez" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                    >
                </div>

                <div>
                    <label for="segundo_apellido" class="block text-sm font-semibold text-slate-200 mb-2">
                        Segundo Apellido
                    </label>
                    <input 
                        type="text" 
                        id="segundo_apellido" 
                        placeholder="González" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                    >
                </div>

                <div class="md:col-span-2">
                    <label for="correo" class="block text-sm font-semibold text-slate-200 mb-2">
                        Correo Electrónico *
                    </label>
                    <input 
                        type="email" 
                        id="correo" 
                        placeholder="correo@ejemplo.com" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500"
                    >
                </div>

                <div class="md:col-span-2 relative">
                    <label for="rol" class="block text-sm font-semibold text-slate-200 mb-2">
                        Rol Inicial *
                    </label>
                    <div class="relative">
                        <select 
                            id="rol" 
                            class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all appearance-none cursor-pointer"
                        >
                            <option value="empresario">Empresario</option>
                            <option value="admin_inventario">Admin de Inventario</option>
                            <option value="empleado" selected>Empleado</option>
                            <option value="pendiente">Pendiente</option>
                        </select>
                        <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="#64748b" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="relative">
                    <label for="password" class="block text-sm font-semibold text-slate-200 mb-2">
                        Contraseña *
                    </label>
                    <div class="relative">
                        <input 
                            type="password" 
                            id="password" 
                            placeholder="••••••••" 
                            class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500 tracking-widest"
                        >
                        <button type="button" class="absolute right-4 top-3.5 text-slate-400 cursor-default">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-semibold text-slate-200 mb-2">
                        Confirmar Contraseña *
                    </label>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        placeholder="••••••••" 
                        class="w-full bg-[#162520] border border-[#20362f] text-white text-sm rounded-xl px-4 py-3 outline-none focus:border-emerald-600 focus:ring-1 focus:ring-emerald-600 transition-all placeholder-slate-500 tracking-widest"
                    >
                </div>

            </div>

            <button type="button" class="w-full mt-8 bg-[#204239] hover:bg-[#2a564a] text-slate-200 font-semibold py-3 px-4 rounded-xl transition-colors shadow-lg">
                Registrarse
            </button>
        </form>

        <div class="mt-6 text-center text-sm text-slate-400">
            ¿Ya tienes cuenta? 
            <a href="login.html" class="text-[#4b7c68] font-semibold hover:text-emerald-500 transition-colors ml-1">
                Inicia sesión aquí
            </a>
        </div>

    </div>
</body>
</html>
